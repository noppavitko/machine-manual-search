const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=s=>s.toUpperCase().replace(/\s+/g,'');
const rows=D.rows.map(([cab,shelf,num,code,qty])=>({cab,shelf,num,code,qty,n:N(code)}));
const max={};rows.forEach(r=>{const k=r.cab+r.shelf;max[k]=Math.max(max[k]||0,r.num)});
const V=q=>[q,q.replace(/^([A-Z]+)(\d)/,'$1-$2')];
const exact1=(r,q)=>r.n===q||(/\d/.test(q)&&r.n.startsWith(q+'-')&&/^\d{1,2}$/.test(r.n.slice(q.length+1)));

const exact=(r,q)=>V(q).some(v=>exact1(r,v));
function diagram(cab,hits){
  const on=new Set(hits.map(h=>h.shelf+'-'+h.num));
  let h='<div class="cab"><small>ตำแหน่งในตู้ '+cab+' (เรียงจากชั้น 1 ลงมา)</small>';
  for(let s=1;s<=4;s++){
    h+='<div class="shelf"><b>ชั้น '+s+'</b><div class="slots">';
    for(let i=1;i<=(max[cab+s]||0);i++)h+=on.has(s+'-'+i)?'<i class="on">'+i+'</i>':'<i></i>';
    h+='</div></div>';
  }
  return h+'</div>';
}
function render(raw){
  const out=$('#out'),q=N(raw);
  $('#x').style.display=raw?'block':'none';
  if(!q){out.innerHTML='<div class="empty">ยังไม่ได้กรอกรหัส ลองพิมพ์ตัวอักษรนำหน้า เช่น KMM, KZM หรือ KTE</div>';return}
  const hits=rows.filter(r=>exact(r,q)).sort((a,b)=>a.cab<b.cab?-1:a.cab>b.cab?1:a.shelf-b.shelf||a.num-b.num);
  if(!hits.length){
    const seen=new Map();
    rows.filter(r=>V(q).some(v=>r.n.includes(v))).forEach(r=>{if(!seen.has(r.n))seen.set(r.n,r.code)});
    const list=[...seen.values()].slice(0,16);
    out.innerHTML=list.length
      ?'<p class="sum">ยังไม่พบรหัส “'+esc(raw.trim())+'” ตรงตัว รหัสที่ใกล้เคียง:</p><div class="chips">'+list.map(c=>'<button data-c="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'
      :'<div class="none">ไม่พบรหัส “'+esc(raw.trim())+'” ในตู้ทั้ง 7 ตู้ ตรวจตัวสะกดอีกครั้ง หรือลองพิมพ์เฉพาะส่วนหน้าของรหัส</div>';
    return;
  }
  const by={};hits.forEach(h=>(by[h.cab]=by[h.cab]||[]).push(h));
  const cabs=Object.keys(by);
  let h='<p class="sum">พบ '+hits.length+' ช่อง ใน '+cabs.length+' ตู้</p>';
  cabs.forEach(c=>{
    h+='<section class="group"><div class="ghead">ตู้ '+c+'<span>'+esc(D.cabs[c])+'</span></div>';
    by[c].forEach(r=>{
      const slot=c+r.shelf+'-'+r.num;
      h+='<div class="hit"><div class="plate">'+slot+'</div><div><div class="where">ตู้ '+c+' · ชั้น '+r.shelf+' · ช่องที่ '+r.num+'</div><div class="meta">ป้ายในช่อง: '+esc(r.code)+(r.qty?' · '+esc(r.qty):'')+'</div></div></div>';
    });
    h+=diagram(c,by[c])+'</section>';
  });
  out.innerHTML=h;
}
const inp=$('#q');
inp.addEventListener('input',()=>render(inp.value));
$('#x').onclick=()=>{inp.value='';render('');inp.focus()};
$('#out').addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(b){inp.value=b.dataset.c;render(inp.value);inp.focus()}});
const h0=decodeURIComponent(location.hash.slice(1)).replace(/_/g,' ');
if(h0)inp.value=h0;
render(inp.value);
</script>
